<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Papan Kantor</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');
:root{
  --bg:#132019; --bg2:#0d1712; --panel:#1c2b22; --panel-2:#213426; --line:rgba(233,218,181,0.14);
  --brass:#c7a244; --brass-bright:#e4c567; --ivory:#f3ecdd; --ivory-dim:rgba(243,236,221,0.62);
  --ink:#1b140c; --good:#5fa06d; --alert:#c15c50;
}
*{box-sizing:border-box;}
body{margin:0; background:var(--bg); color:var(--ivory); font-family:'Inter',sans-serif; min-height:100vh;}
h1{font-family:'Fraunces',serif; font-size:22px; margin:0 0 4px;}
.wrap{max-width:760px; margin:0 auto; padding:30px 18px 60px;}
.tag{color:var(--brass-bright); font-family:'IBM Plex Mono',monospace; font-size:12px;}
.card{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:24px; margin-top:18px;}
input{width:100%; padding:11px 12px; border-radius:8px; border:1px solid var(--line); background:var(--bg2); color:var(--ivory); font-size:15px; margin-bottom:12px;}
button{padding:10px 16px; border-radius:8px; border:none; background:linear-gradient(180deg,var(--brass-bright),var(--brass)); color:var(--ink); font-weight:700; cursor:pointer; font-size:13.5px;}
button.ghost{background:transparent; border:1px solid var(--line); color:var(--ivory-dim);}
.err{color:var(--alert); font-size:12.5px; margin-top:4px;}
table{width:100%; border-collapse:collapse; margin-top:16px; font-size:13.5px;}
th{text-align:left; color:var(--ivory-dim); font-size:11px; text-transform:uppercase; letter-spacing:0.05em; padding:8px; border-bottom:1px solid var(--line);}
td{padding:10px 8px; border-bottom:1px solid rgba(255,255,255,0.04); vertical-align:middle;}
td.token{font-family:'IBM Plex Mono',monospace; color:var(--brass-bright); font-weight:600;}
.badge{display:inline-block; padding:3px 9px; border-radius:999px; font-size:11px; font-weight:600;}
.badge.pending{background:rgba(193,92,80,0.18); color:var(--alert);}
.badge.sent{background:rgba(95,160,109,0.18); color:var(--good);}
.row-actions{display:flex; gap:8px; flex-wrap:wrap;}
.row-actions button{padding:6px 10px; font-size:12px;}
.topbar{display:flex; justify-content:space-between; align-items:center;}
.empty{color:var(--ivory-dim); padding:20px 0; text-align:center;}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div>
      <div class="tag">Catur Online</div>
      <h1>Panel Administrator</h1>
    </div>
    <button class="ghost" id="btn-logout" style="display:none;">Keluar</button>
  </div>

  <div class="card" id="login-card">
    <p style="color:var(--ivory-dim); font-size:13.5px; margin-top:0;">Masuk pakai password administrator (diatur lewat ADMIN_PASSWORD di server).</p>
    <input id="admin-password" type="password" placeholder="Password admin">
    <button id="btn-admin-login">Masuk</button>
    <div class="err" id="login-err"></div>
  </div>

  <div class="card" id="data-card" style="display:none;">
    <p style="color:var(--ivory-dim); font-size:13.5px; margin-top:0;">
      Daftar pendaftar & token login mereka. Salin token, kirim manual lewat WhatsApp ke nomor terdaftar, lalu tandai "Sudah Dikirim".
    </p>
    <table>
      <thead><tr><th>Nama</th><th>WhatsApp</th><th>Token</th><th>Status</th><th>Aksi</th></tr></thead>
      <tbody id="reg-body"></tbody>
    </table>
    <div id="empty-note" class="empty" style="display:none;">Belum ada pendaftar.</div>
  </div>
</div>

<script>
async function api(path, opts){
  const res = await fetch(path, Object.assign({headers:{'Content-Type':'application/json'}}, opts||{}));
  const data = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data.error||'Gagal.');
  return data;
}
function escapeHtml(s){ const d=document.createElement('div'); d.textContent=s==null?'':String(s); return d.innerHTML; }
function fmtDate(ts){ return new Date(ts).toLocaleString('id-ID'); }

function showLoggedIn(){
  document.getElementById('login-card').style.display='none';
  document.getElementById('data-card').style.display='block';
  document.getElementById('btn-logout').style.display='inline-block';
  loadRegistrations();
}
function showLoggedOut(){
  document.getElementById('login-card').style.display='block';
  document.getElementById('data-card').style.display='none';
  document.getElementById('btn-logout').style.display='none';
}

document.getElementById('btn-admin-login').addEventListener('click', async ()=>{
  const errEl = document.getElementById('login-err');
  errEl.textContent='';
  const password = document.getElementById('admin-password').value;
  try{
    await api('/api/admin/login', {method:'POST', body: JSON.stringify({password})});
    document.getElementById('admin-password').value='';
    showLoggedIn();
  }catch(e){ errEl.textContent = e.message; }
});

document.getElementById('btn-logout').addEventListener('click', async ()=>{
  await api('/api/admin/logout', {method:'POST'});
  showLoggedOut();
});

async function loadRegistrations(){
  try{
    const rows = await api('/api/admin/registrations', {method:'GET'});
    const body = document.getElementById('reg-body');
    document.getElementById('empty-note').style.display = rows.length===0 ? 'block' : 'none';
    body.innerHTML = rows.map(r=>{
      const statusBadge = r.token_sent
        ? '<span class="badge sent">Sudah Dikirim</span>'
        : '<span class="badge pending">Belum Dikirim</span>';
      return '<tr>'+
        '<td>'+escapeHtml(r.name)+'</td>'+
        '<td>'+escapeHtml(r.phone)+'</td>'+
        '<td class="token">'+escapeHtml(r.token)+'</td>'+
        '<td>'+statusBadge+'</td>'+
        '<td class="row-actions">'+
          '<button class="ghost" data-copy="'+escapeHtml(r.token)+'">Salin Token</button>'+
          (r.token_sent ? '' : '<button data-mark="'+escapeHtml(r.token)+'">Tandai Terkirim</button>')+
        '</td>'+
      '</tr>';
    }).join('');
    body.querySelectorAll('[data-copy]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        navigator.clipboard.writeText(btn.dataset.copy).then(()=>{
          btn.textContent='Tersalin!';
          setTimeout(()=>btn.textContent='Salin Token', 1200);
        });
      });
    });
    body.querySelectorAll('[data-mark]').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        await api('/api/admin/mark-sent', {method:'POST', body: JSON.stringify({token: btn.dataset.mark})});
        loadRegistrations();
      });
    });
  }catch(e){
    showLoggedOut();
  }
}

(async function init(){
  try{
    const s = await api('/api/admin/session', {method:'GET'});
    if(s.isAdmin) showLoggedIn(); else showLoggedOut();
  }catch(e){ showLoggedOut(); }
})();
</script>
</body>
  </html>
